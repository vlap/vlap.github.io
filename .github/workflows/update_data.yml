name: Update Research Metrics

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - run: pip install -r scripts/requirements.txt

      - name: Fetch OpenAlex Metrics
        run: python3 scripts/fetch_openalex.py

      - name: Update Stats
        run: python3 scripts/update_stats.py

      - name: Commit and Push
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/scholar_stats.yaml data/stats.yaml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update monthly OpenAlex metrics [$(date +'%Y-%m-%d')]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update-data
    if: needs.update-data.outputs.changed == 'true'
    uses: ./.github/workflows/hugo.yml
    permissions:
      contents: read
      pages: write
      id-token: write
