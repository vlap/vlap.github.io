<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentHpc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)" rx="8" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="430" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="55" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">MARENOSTRUM 5 · AUTOSUBMIT ENSEMBLE DAG</text>

  <!-- Top Node: Atmospheric & Oceanic Init -->
  <g transform="translate(260, 80)">
    <rect width="280" height="52" rx="6" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Coupled State Initialization</text>
    <text x="140" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">EN4 / ORAS5 Nudging + ERA5 Atmosphere</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="132" x2="400" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Split into Member DAGs -->
  <line x1="400" y1="150" x2="160" y2="150" stroke="#38bdf8" stroke-width="2" />
  <line x1="400" y1="150" x2="640" y2="150" stroke="#38bdf8" stroke-width="2" />
  <line x1="160" y1="150" x2="160" y2="178" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="150" x2="640" y2="178" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Member 01 -->
  <g transform="translate(50, 180)">
    <rect width="220" height="95" rx="6" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#334155" />
    <text x="110" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">MEMBER 01 · CHUNK 01</text>
    <text x="15" y="44" font-family="monospace" font-size="11" fill="#38bdf8">OpenIFS CY48R1.1 (SP)</text>
    <text x="15" y="62" font-family="monospace" font-size="11" fill="#38bdf8">NEMO4 + PISCES</text>
    <text x="15" y="80" font-family="monospace" font-size="10" fill="#94a3b8">lfs setstripe -c 8 -S 4M</text>
  </g>

  <!-- Member N -->
  <g transform="translate(530, 180)">
    <rect width="220" height="95" rx="6" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#334155" />
    <text x="110" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">MEMBER 60 · CHUNK 01</text>
    <text x="15" y="44" font-family="monospace" font-size="11" fill="#38bdf8">OpenIFS CY48R1.1 (SP)</text>
    <text x="15" y="62" font-family="monospace" font-size="11" fill="#38bdf8">NEMO4 + PISCES</text>
    <text x="15" y="80" font-family="monospace" font-size="10" fill="#94a3b8">lfs setstripe -c 8 -S 4M</text>
  </g>

  <!-- Center Parallel Indicator -->
  <text x="400" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle">· · · 60 MEMBERS · · ·</text>

  <!-- Arrows to Checkpoint & CMOR -->
  <line x1="160" y1="275" x2="160" y2="310" stroke="#38bdf8" stroke-width="2" />
  <line x1="640" y1="275" x2="640" y2="310" stroke="#38bdf8" stroke-width="2" />
  <line x1="160" y1="310" x2="400" y2="310" stroke="#38bdf8" stroke-width="2" />
  <line x1="640" y1="310" x2="400" y2="310" stroke="#38bdf8" stroke-width="2" />
  <line x1="400" y1="310" x2="400" y2="335" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bottom Node: Autosubmit State Recovery & CMOR -->
  <g transform="translate(240, 338)">
    <rect width="320" height="54" rx="6" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="160" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Hash Verification &amp; CMORization</text>
    <text x="160" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#10b981" text-anchor="middle">Bit-for-Bit Validated Checkpoint $\rightarrow$ Resumable Chunk N+1</text>
  </g>
</svg>
