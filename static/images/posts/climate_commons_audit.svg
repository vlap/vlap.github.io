<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121e" />
      <stop offset="100%" stop-color="#0f2b3c" />
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bgGrad4)" rx="8" />

  <!-- Badge -->
  <rect x="40" y="30" width="460" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="55" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10b981" letter-spacing="0.5">CLIMATE COMMONS · PRAGMATIC AUDIT ARCHITECTURE</text>

  <!-- Flow 1: Schema Specification -->
  <g transform="translate(60, 95)">
    <rect width="200" height="255" rx="8" fill="url(#boxGrad4)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="32" rx="8" fill="#0369a1" />
    <text x="100" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">1. Declarative Schemas</text>
    
    <text x="15" y="60" font-family="monospace" font-size="11" fill="#38bdf8">• JSON Schema contracts</text>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#94a3b8">• Type-checked grids</text>
    <text x="15" y="110" font-family="monospace" font-size="11" fill="#94a3b8">• Unit definitions</text>
    <text x="15" y="135" font-family="monospace" font-size="11" fill="#94a3b8">• Remapping boundaries</text>
    
    <rect x="15" y="180" width="170" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="100" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Zero Ambiguity</text>
    <text x="100" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Self-describing tasks</text>
  </g>

  <!-- Flow 2: Deterministic Verification -->
  <g transform="translate(300, 95)">
    <rect width="200" height="255" rx="8" fill="url(#boxGrad4)" stroke="#10b981" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="32" rx="8" fill="#047857" />
    <text x="100" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">2. Deterministic CI</text>

    <text x="15" y="60" font-family="monospace" font-size="11" fill="#10b981">• Invariant conservation</text>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#94a3b8">• Offline test fixtures</text>
    <text x="15" y="110" font-family="monospace" font-size="11" fill="#94a3b8">• Synthetic toy NetCDFs</text>
    <text x="15" y="135" font-family="monospace" font-size="11" fill="#94a3b8">• Exit-code verification</text>

    <rect x="15" y="180" width="170" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="100" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">Fast Fail-First CI</text>
    <text x="100" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">&lt; 3.5s pytest suite</text>
  </g>

  <!-- Flow 3: YAGNI Purge -->
  <g transform="translate(540, 95)">
    <rect width="200" height="255" rx="8" fill="url(#boxGrad4)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="32" rx="8" fill="#b45309" />
    <text x="100" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">3. YAGNI Bloat Purge</text>

    <text x="15" y="60" font-family="monospace" font-size="11" fill="#f59e0b">• -112 MB repository size</text>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#94a3b8">• -5,500 ghost files</text>
    <text x="15" y="110" font-family="monospace" font-size="11" fill="#94a3b8">• Purged unused wrappers</text>
    <text x="15" y="135" font-family="monospace" font-size="11" fill="#94a3b8">• Flat, decoupled code</text>

    <rect x="15" y="180" width="170" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="100" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">Pragmatic Scientist</text>
    <text x="100" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Code that earns its keep</text>
  </g>

  <!-- Bottom Summary -->
  <text x="400" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Replacing speculative wrappers with flat, verified data pipelines and strict test boundaries.</text>
</svg>
