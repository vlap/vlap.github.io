  - title: Postdoctoral Scientist
    dates: "03/2015 – 09/2017"
    institution: Max Planck Institute for Meteorology (MPI-M)
    location: Hamburg, Germany
    bullets:
      - lead: "Unstructured-Grid Sea-Ice Solver:"
        text: "Implemented an iterative elastic-viscous-plastic (EVP) rheology solver with subcycling in parallel Fortran/MPI for ICON-ESM on icosahedral grids (down to 10 km resolution), keeping the scheme stable under stiff stress regimes."
      - lead: "Model Evaluation & Scaling:"
        text: "Tested numerical conservation, ran parallel scaling benchmarks across 100s of HPC nodes, and validated coupled ocean-sea-ice simulations against observations."
  - title: Research Fellow
    dates: "11/2011 – 12/2014"
    institution: University of Leeds
    location: Leeds, United Kingdom
    bullets:
      - lead: "Global Tide & Internal Wave Solver:"
        text: "Built a parallel spectral-finite-difference solver from scratch for barotropic and baroclinic tides at 2 arc-minute resolution (1M+ unknowns, Fortran/MPI) and validated wave energy dissipation against global observations (Rev. Geophys., 2014)."
      - lead: "Boundary Discretization:"
        text: "Improved finite-difference accuracy at coastlines, where I developed a novel second-order C-grid boundary scheme removing O(1) staircase errors at irregular boundaries (Ocean Modelling, 2014)."

