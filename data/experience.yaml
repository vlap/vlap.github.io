employment:
  - title: Senior Research Engineer
    dates: "04/2025 – Present"
    institution: Barcelona Supercomputing Center (BSC)
    location: Barcelona, Spain
    bullets:
      - lead: "Prediction Workflows:"
        text: "I co-lead Auto-EC-Earth4 (Autosubmit/Slurm), building automated production DAG workflows from initial-condition generation and 50–100 member ensemble runs to postprocessing and evaluation against observations for CMIP7 and WMO/DCPP."
      - lead: "Coupled Model Development & Tuning:"
        text: "Co-maintain the EC-Earth4 coupled model across a consortium of 30 European institutes; implemented single-precision execution, load balancing, and MPI optimizations cutting coupled runtime by 2–3× for Destination Earth and CMIP7."
      - lead: "Hybrid ML & Verification:"
        text: "Designed interfaces to couple neural emulators with EC-Earth4, adapted the Flowers neural PDE solver for 3D tracers, co-developed a GNN ocean biogeochemistry emulator, and trained GNNs in Anemoi with automated mass-conservation and drift checks."
  - title: Recognized Research Engineer (R2)
    dates: "03/2019 – 03/2025"
    institution: Barcelona Supercomputing Center (BSC)
    location: Barcelona, Spain
    bullets:
      - lead: "Data Assimilation & State Estimation:"
        text: "Implemented ensemble Kalman filter (EnKF) and nudging methods in NEMO/EC-Earth3 (1M+ variables) to assimilate satellite sea-ice and ocean observations, reducing initialization shock and SST/sea-ice forecast bias (Environ. Res. Lett., 2022)."
      - lead: "Ensemble Runs & 3D Tracer Budgets:"
        text: "Ran 50–100 member decadal predictions for the WMO Climate Update (BAMS, 2022) and built 3D advective-diffusive tracer diagnostics in NEMO to close carbon and heat budgets (ESD, 2024; Sci. Adv., 2026)."
