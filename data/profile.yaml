description: Senior Research Engineer, BSC · Climate models, HPC, ML emulators
bio: 'I am a Senior Research Engineer at the Barcelona Supercomputing Center. I work
  on the EC-Earth4 climate model: coupling, performance on MareNostrum 5, and the
  ensemble workflows behind our decadal predictions for CMIP7. Before BSC, I wrote
  sea-ice and ocean-tide solvers at MPI-M and the University of Leeds. Climate models
  have become too expensive to improve, and I think AI tools and automated verification
  can make that work affordable again.'
current_focus: Preparing EC-Earth4 for CMIP7 on MareNostrum 5, tracer mass conservation
  in OpenIFS, and coupling neural emulators to EC-Earth4.
