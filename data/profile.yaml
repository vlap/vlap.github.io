bio: |
  Senior Research Engineer at the Barcelona Supercomputing Center (BSC) working on Earth system models (EC-Earth4, OpenIFS, NEMO), co-leading Auto-EC-Earth4 ensemble workflows on MareNostrum 5, and leading AI adoption across the research group. For years, advancing the fidelity of Earth system models has been hindered by escalating code and physical complexity; my mission is leveraging AI and automated verification to make high-fidelity climate prediction affordable to science again.
current_focus: "Tracer mass conservation & stochastic rounding in OpenIFS CY48R1.1, and preparing EC-Earth4 for CMIP7 on MareNostrum 5"
