- id: "global-ocean-tides"
  title: "Global Ocean Tide Simulation"
  model: "baro_tides_fd & internal_tides_fd"
  platform: "University of Leeds HPC"
  poster: "/images/simulations/global-ocean-tides-poster.webp"
  video_webm: "/videos/simulations/global-ocean-tides.webm"
  video_mp4: "/videos/simulations/global-ocean-tides.mp4"
  physics: "2D spherical staggered C-grid finite difference with 2-arcminute bathymetry, second-order irregular coastline boundary discretization, and Sturm-Liouville vertical modal projection."
  description: "Global propagation of barotropic surface tides and conversion into internal baroclinic wave modes over steep midocean ridges and continental slopes."

- id: "overturning-wave"
  title: "Overturning Wave & Resonant Jet Dynamics"
  model: "Free-Surface Navier-Stokes (COMSOL)"
  platform: "MACSI, University of Limerick"
  poster: "/images/simulations/overturning-wave-poster.webp"
  video_webm: "/videos/simulations/overturning-wave.webm"
  video_mp4: "/videos/simulations/overturning-wave.mp4"
  physics: "Nonlinear free-surface evolution capturing x-velocity, closed streamline recirculation eddies, and steepening fronts beyond long-wave lubrication approximations."
  description: "Time-dependent simulation of an overturning thin-film wave profile resolving velocity fields and recirculation streamlines past single-valued height parametrizations."

- id: "rimming-flow"
  title: "Viscous Rimming Flow Beyond Lubrication Theory"
  model: "Rotating-Cylinder Thin-Film Flow"
  platform: "MACSI, University of Limerick"
  poster: "/images/simulations/rimming-flow-poster.webp"
  video_webm: "/videos/simulations/rimming-flow.webm"
  video_mp4: "/videos/simulations/rimming-flow.mp4"
  physics: "Visco-capillary coating inside a horizontal rotating cylinder, exhibiting hydrofoil-like recirculation pools, axial instabilities, and steep front transitions."
  description: "Experimental visualization of viscous rimming flow inside a horizontal rotating tube, illustrating pooling and steep fronts where classical lubrication theory breaks down."
