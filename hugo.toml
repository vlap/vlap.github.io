baseURL = "https://vlap.github.io/"
locale = "en-us"
title = "Vladimir Lapin"
theme = "PaperMod"

description = "Vladimir Lapin, Senior Research Engineer at BSC. Climate models, HPC and ML emulators."
keywords = ["Vladimir Lapin", "Climate Modelling", "HPC Engineering", "Applied Mathematics", "Machine Learning", "BSC", "Barcelona Supercomputing Center", "Data Assimilation"]

[params]
    defaultTheme = "auto"
    author = "Dr. Vladimir Lapin"
    
    # SEO & Social Cards
    description = "Vladimir Lapin, Senior Research Engineer at BSC. Climate models, HPC and ML emulators."
    images = ["images/decor/vladimir_lapin.jpg"]
    
    # Post & Navigation Features
    ShowReadingTime = false
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = false
    ShowCodeCopyButtons = true
    ShowToc = false
    ShowScrollToTop = true
    mainSections = ["posts"]
    
    # Minification
    [params.minify]
        disableHTML = false
        disableJS = false
        disableCSS = false

    [params.assets]

        favicon = "favicon.svg"
        favicon16x16 = "favicon.svg"
        favicon32x32 = "favicon.svg"
        apple_touch_icon = "favicon.svg"
        safari_pinned_tab = "favicon.svg"
    
    [params.profileMode]
        enabled = false
        title = "Dr. Vladimir Lapin"
        subtitle = "Senior Research Engineer · Climate & Geophysical Models · HPC · Predictions · AI Adoption"
        imageUrl = "images/decor/vladimir_lapin.jpg"
        imageWidth = 120
        imageHeight = 120
        imageTitle = "Vladimir Lapin"
        
        [[params.profileMode.buttons]]
            name = "Work"
            url = "/work/"
        [[params.profileMode.buttons]]
            name = "CV"
            url = "/cv/"

    [params.homeInfoParams]
        Title = "Dr. Vladimir Lapin"
        Image = "images/decor/vladimir_lapin.jpg"

    [[params.socialIcons]]
        name = "email"
        title = "Email"
        url = "mailto:vladimir.lapin@bsc.es"
    [[params.socialIcons]]
        name = "github"
        title = "GitHub"
        url = "https://github.com/vlap"
    [[params.socialIcons]]
        name = "linkedin"
        title = "LinkedIn"
        url = "https://linkedin.com/in/vladimir-lapin"
    [[params.socialIcons]]
        name = "googlescholar"
        title = "Google Scholar"
        url = "https://scholar.google.com/citations?user=ZVQF-ggAAAAJ&hl=en"
    [[params.socialIcons]]
        name = "orcid"
        title = "ORCID"
        url = "https://orcid.org/0000-0001-7302-8539"
    [[params.socialIcons]]
        name = "rss"
        title = "RSS"
        url = "/index.xml"

[taxonomies]
    tag = "tags"
    category = "categories"
    kind = "kinds"

[outputs]
    home = ["HTML", "RSS"]

[menu]
    [[menu.main]]
        identifier = "work"
        name = "Work"
        url = "/work/"
        weight = 10
    [[menu.main]]
        identifier = "log"
        name = "Log"
        url = "/posts/"
        weight = 20
    [[menu.main]]
        identifier = "cv"
        name = "CV"
        url = "/cv/"
        weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
